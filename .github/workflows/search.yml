name: Search YouTube music videos

on:
  workflow_dispatch:
    inputs:
      max_results_per_query:
        description: Maximum results per query, or "all"
        required: true
        default: "all"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: youtube-music-video-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest -q
      - name: Search
        env:
          INPUT_LIMIT: ${{ inputs.max_results_per_query }}
        run: |
          limit="${INPUT_LIMIT:-all}"
          if [ "$limit" = "all" ]; then
            youtube-music-search --config config/searches.yaml --all
          else
            youtube-music-search --config config/searches.yaml --limit "$limit"
          fi
      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-inventory-${{ github.run_id }}
          path: output/
          if-no-files-found: error
      - name: Commit updated inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/
          if git diff --cached --quiet; then
            echo "Inventory unchanged"
          else
            git commit -m "data: refresh YouTube video inventory"
            git push origin HEAD:main
          fi
